<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Stream Interface</title>
    <style>
        :root { --bg: #09090b; --card: #18181b; --border: #27272a; --text: #f4f4f5; --muted: #71717a; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 3rem 1.5rem; display: flex; justify-content: center; user-select: none; -webkit-user-select: none; }
        main { width: 100%; max-width: 650px; }
        h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 2rem; border-left: 3px solid #3b82f6; padding-left: 10px; }
        #wrapper { display: flex; flex-direction: column; gap: 1rem; }
        .card { background-color: var(--card); border: 1px solid var(--border); border-radius: 6px; padding: 1.25rem; }
        .title { font-size: 1.15rem; margin: 0 0 0.25rem 0; font-weight: 600; color: #fff; }
        .time { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
        .body { font-size: 0.95rem; line-height: 1.5; color: #d4d4d8; }
    </style>
</head>
<body>
    <main>
        <h1>Synchronized Live Database Feed</h1>
        <div id="wrapper">Loading secure pipeline metrics...</div>
    </main>
    <script>
        const INTERVAL = 2 * 60 * 60 * 1000; 
        async function fetchFeed() {
            const wrap = document.getElementById('wrapper');
            try {
                const r = await fetch('http://127.0.0');
                if(!r.ok) throw new Error("Stream down");
                const data = await r.json();
                wrap.innerHTML = data.length === 0 ? '<p class="body">Database empty.</p>' : '';
                data.forEach(item => {
                    const el = document.createElement('article');
                    el.className = 'card';
                    el.innerHTML = `<h2 class="title">${esc(item.title)}</h2><div class="time">Logged: ${esc(new Date(item.created_at+'Z').toLocaleString())}</div><p class="body">${esc(item.content)}</p>`;
                    wrap.appendChild(el);
                });
            } catch(e) { wrap.innerHTML = `<p style="color:#ef4444;">Pipeline Error: ${esc(e.message)}</p>`; }
        }
        function esc(s) { return String(s || '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
        fetchFeed();
        setInterval(fetchFeed, INTERVAL);
    </script>
</body>
</html>
